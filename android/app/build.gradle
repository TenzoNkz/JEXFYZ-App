import java.security.KeyStore
import java.util.Base64

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { inputStream ->
        localProperties.load(inputStream)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '3'
}

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def productionSigningReady = releaseStoreFile &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword &&
        file(releaseStoreFile).exists()

def officialSigningCertBase64 = ''
if (productionSigningReady) {
    Exception lastError = null
    for (storeType in ['PKCS12', 'JKS']) {
        try {
            def keyStore = KeyStore.getInstance(storeType)
            file(releaseStoreFile).withInputStream { input ->
                keyStore.load(input, releaseStorePassword.toCharArray())
            }
            def certificate = keyStore.getCertificate(releaseKeyAlias)
            if (certificate == null) {
                throw new GradleException("Signing alias not found: ${releaseKeyAlias}")
            }
            officialSigningCertBase64 = Base64.getEncoder().encodeToString(certificate.getEncoded())
            break
        } catch (Exception e) {
            lastError = e
        }
    }

    if (officialSigningCertBase64.isEmpty()) {
        throw new GradleException("Unable to read the production signing certificate", lastError)
    }
}

android {
    buildFeatures {
        buildConfig = true
    }

    namespace "com.horizontalzzz.jexfyz"
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.horizontalzzz.jexfyz"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName "1.0.0"
    }

    signingConfigs {
        if (productionSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'OFFICIAL_SIGNING_CERT_B64', '""'
        }

        release {
            if (!productionSigningReady) {
                throw new GradleException('Production release signing is not configured. Set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
            }

            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'OFFICIAL_SIGNING_CERT_B64', "\"${officialSigningCertBase64}\""
        }
    }
}

flutter {
    source = "../.."
}
