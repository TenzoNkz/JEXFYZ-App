// AI BUILD MEMORY:
// Root Gradle configuration. Keep application-specific details in android/app/build.gradle.

// Shared Maven/Google repositories.
allprojects {
    repositories {
        google()
        mavenCentral()

        // Kadb 1.3.0 resolves its SPAKE2 runtime artifact from JitPack.
        // Keep this repository scoped to the exact missing module.
        maven {
            url = uri("https://jitpack.io")
            content {
                includeModule("com.github.Flyfish233", "spake2-java")
            }
        }
    }
}

// Keep generated Android build output under Flutter's build directory.
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Remove generated Gradle/Android output only.
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
