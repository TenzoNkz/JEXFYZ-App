pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        def configuredPath = properties.getProperty("flutter.sdk")
        def environmentPath = System.getenv("FLUTTER_ROOT")
        def resolvedPath = configuredPath ?: environmentPath

        assert resolvedPath != null && resolvedPath.trim(),
                "flutter.sdk is not configured. Set flutter.sdk in android/local.properties or FLUTTER_ROOT in the environment."

        return resolvedPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.2.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
    id "com.google.gms.google-services" version "4.4.3" apply false
}

rootProject.name = 'je_cooler'
include ':app'
