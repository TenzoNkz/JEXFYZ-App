# JE X FYZ App — single manual build trigger.
# This is the only workflow that should be started manually for "Build App".
# It calls the reusable App Build engine exactly once.
name: Build App

on:
  workflow_dispatch:
  # TEMPORARY: push trigger listens only to the one-shot marker file.
  push:
    paths:
      - .github/.build-trigger
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/app-build.yml
    secrets: inherit
