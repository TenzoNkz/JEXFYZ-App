name: Temporary V1.3 Source Export

on:
  push:
    paths:
      - ".github/FIRMWARE_SOURCE_EXPORT_TRIGGER"

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package source
        run: |
          set -euo pipefail
          test -s firmware/JEXFYZ.ino
          cp firmware/JEXFYZ.ino JEXFYZ-V1.3.ino
          sha256sum JEXFYZ-V1.3.ino
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: JEXFYZ-V1.3-INO
          path: JEXFYZ-V1.3.ino
          if-no-files-found: error
          retention-days: 1
