# JE X FYZ — OTA SECURITY SEAL
# Guardrail only: this workflow validates the already-proven OTA contract.
# It never builds or publishes the App APK, and it never changes Firebase data.
# Intentional OTA-seal changes require [OTA-SEAL-RENEW] in the current PR title/body
# or the pushed commit message, plus an updated manifest/lock that still passes all checks.

name: JE X FYZ OTA Security Seal

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jexfyz-ota-security-seal-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-security-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify OTA Security Seal
        shell: bash
        env:
          OTA_SEAL_RENEWAL_PR_TITLE: \${{ github.event.pull_request.title }}
          OTA_SEAL_RENEWAL_PR_BODY: \${{ github.event.pull_request.body }}
          OTA_SEAL_RENEWAL_HEAD_COMMIT: \${{ github.event.head_commit.message }}
          OTA_SEAL_LOCK: firmware/OTA_SECURITY_SEAL.lock
          OTA_SEAL_MANIFEST: firmware/OTA_SECURITY_SEAL.json
          OTA_SEAL_WORKFLOW: .github/workflows/ota-security-seal.yml
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          LOCK_PATH = Path(os.environ["OTA_SEAL_LOCK"])
          MANIFEST_PATH = Path(os.environ["OTA_SEAL_MANIFEST"])
          WORKFLOW_PATH = Path(os.environ["OTA_SEAL_WORKFLOW"])

          def fail(message: str) -> None:
              raise SystemExit("JE X FYZ OTA SECURITY SEAL FAILED: " + message)

          def git_blob_sha1(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode("utf-8")
              return hashlib.sha1(header + data).hexdigest()

          def read_bytes(path: Path) -> bytes:
              if not path.is_file():
                  fail(f"required file is missing: {path}")
              return path.read_bytes()

          def read_lock(path: Path) -> dict:
              raw = path.read_text(encoding="utf-8")
              values = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "=" not in line:
                      fail(f"malformed lock line: {line}")
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
              return values

          def find_definition(source: str, symbol: str):
              pos = 0
              needle = symbol + "("
              while True:
                  idx = source.find(needle, pos)
                  if idx < 0:
                      fail(f"definition not found: {symbol}")
                  brace = source.find("{", idx)
                  semi = source.find(";", idx)
                  if brace >= 0 and (semi < 0 or brace < semi):
                      start = source.rfind("\\n", 0, idx) + 1
                      depth = 0
                      in_string = None
                      escaped = False
                      in_line_comment = False
                      in_block_comment = False
                      i = brace
                      while i < len(source):
                          ch = source[i]
                          nx = source[i + 1] if i + 1 < len(source) else ""
                          if in_line_comment:
                              if ch == "\\n":
                                  in_line_comment = False
                          elif in_block_comment:
                              if ch == "*" and nx == "/":
                                  in_block_comment = False
                                  i += 1
                          elif in_string:
                              if escaped:
                                  escaped = False
                              elif ch == "\\\\":
                                  escaped = True
                              elif ch == in_string:
                                  in_string = None
                          elif ch == "/" and nx == "/":
                              in_line_comment = True
                              i += 1
                          elif ch == "/" and nx == "*":
                              in_block_comment = True
                              i += 1
                          elif ch in ('"', "'", "\`"):
                              in_string = ch
                          elif ch == "{":
                              depth += 1
                          elif ch == "}":
                              depth -= 1
                              if depth == 0:
                                  return start, i + 1, source[start:i + 1]
                          i += 1
                  pos = idx + len(needle)

          def strip_cpp_comments(source: str) -> str:
              out = []
              i = 0
              in_string = None
              escaped = False
              in_line = False
              in_block = False
              while i < len(source):
                  ch = source[i]
                  nx = source[i + 1] if i + 1 < len(source) else ""
                  if in_line:
                      if ch == "\\n":
                          in_line = False
                          out.append("\\n")
                      else:
                          out.append(" ")
                  elif in_block:
                      if ch == "*" and nx == "/":
                          in_block = False
                          out.extend("  ")
                          i += 1
                      elif ch == "\\n":
                          out.append("\\n")
                      else:
                          out.append(" ")
                  elif in_string:
                      out.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == "\\\\":
                          escaped = True
                      elif ch == in_string:
                          in_string = None
                  elif ch == "/" and nx == "/":
                      in_line = True
                      out.extend("  ")
                      i += 1
                  elif ch == "/" and nx == "*":
                      in_block = True
                      out.extend("  ")
                      i += 1
                  else:
                      out.append(ch)
                      if ch in ('"', "'"):
                          in_string = ch
                  i += 1
              return "".join(out)

          lock = read_lock(LOCK_PATH)
          manifest_bytes = read_bytes(MANIFEST_PATH)
          workflow_bytes = read_bytes(WORKFLOW_PATH)
          manifest = json.loads(manifest_bytes.decode("utf-8"))

          if manifest.get("schema") != "JEXFYZ_OTA_SECURITY_SEAL_V1":
              fail("unsupported or missing seal schema")

          if lock.get("manifest_sha1") != git_blob_sha1(manifest_bytes):
              fail("OTA_SECURITY_SEAL.json does not match its locked Git-blob fingerprint")
          if lock.get("workflow_sha1") != git_blob_sha1(workflow_bytes):
              fail("ota-security-seal.yml does not match its locked Git-blob fingerprint")

          renewal_text = " ".join([
              os.environ.get("OTA_SEAL_RENEWAL_PR_TITLE", ""),
              os.environ.get("OTA_SEAL_RENEWAL_PR_BODY", ""),
              os.environ.get("OTA_SEAL_RENEWAL_HEAD_COMMIT", ""),
          ])
          renewal_requested = "[OTA-SEAL-RENEW]" in renewal_text

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))

          if event_name == "pull_request":
              base_sha = event["pull_request"]["base"]["sha"]
              head_sha = event["pull_request"]["head"]["sha"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
                  text=True,
              ).splitlines()
          elif event_name == "push":
              before = event.get("before", "")
              after = event.get("after", os.environ.get("GITHUB_SHA", ""))
              if before and set(before) != {"0"}:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, after],
                      text=True,
                  ).splitlines()
              else:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                      text=True,
                  ).splitlines()
          else:
              changed = []

          seal_artifacts = {
              ".github/workflows/ota-security-seal.yml",
              "firmware/OTA_SECURITY_SEAL.json",
              "firmware/OTA_SECURITY_SEAL.lock",
              "OTA_SECURITY_SEAL.md",
          }
          if any(path in seal_artifacts for path in changed) and not renewal_requested:
              fail("seal artifact changed without [OTA-SEAL-RENEW]")

          firmware_files = sorted(Path("firmware").glob("JEXFYZ-V*.ino"))
          if len(firmware_files) != manifest["firmware"]["expected_active_file_count"]:
              fail(
                  "expected exactly one active versioned firmware source; found "
                  + str([p.as_posix() for p in firmware_files])
              )

          fw_path = firmware_files[0]
          fw_source = fw_path.read_text(encoding="utf-8")
          version_match = re.search(r'FW_VERSION\[\]\s*=\s*"V(\d+)\.(\d+)"', fw_source)
          if not version_match:
              fail("FW_VERSION is missing or does not use V<major>.<minor>")
          source_version = f"V{version_match.group(1)}.{version_match.group(2)}"
          if fw_path.stem != f"JEXFYZ-{source_version}":
              fail(
                  f"active firmware filename/version mismatch: {fw_path.as_posix()} vs {source_version}"
              )

          fw_code = strip_cpp_comments(fw_source)
          for anchor in manifest["required_anchors"]["firmware"]:
              if anchor not in fw_source:
                  fail("firmware anchor missing: " + anchor)
          for anchor in manifest["required_anchors"]["absent"]:
              if anchor in fw_source:
                  fail("forbidden firmware anchor returned: " + anchor)
          if re.search(r"\bdelay\s*\(", fw_code):
              fail("executable delay() found")
          def has_timing_while(source: str) -> bool:
              code = strip_cpp_comments(source)
              pos = 0
              while True:
                  match = re.search(r"\bwhile\s*\(", code[pos:])
                  if not match:
                      return False
                  open_paren = pos + match.end() - 1
                  depth = 0
                  close_paren = None
                  for i in range(open_paren, len(code)):
                      if code[i] == "(":
                          depth += 1
                      elif code[i] == ")":
                          depth -= 1
                          if depth == 0:
                              close_paren = i
                              break
                  if close_paren is None:
                      fail("unterminated while() condition")
                  brace = code.find("{", close_paren)
                  if brace < 0:
                      fail("while() loop without a detectable body")
                  body_depth = 0
                  close_brace = None
                  for i in range(brace, len(code)):
                      if code[i] == "{":
                          body_depth += 1
                      elif code[i] == "}":
                          body_depth -= 1
                          if body_depth == 0:
                              close_brace = i
                              break
                  if close_brace is None:
                      fail("unterminated while() body")
                  loop_text = code[open_paren:close_brace + 1]
                  if re.search(r"\b(?:millis|delay|vTaskDelay|esp_timer|xTaskGetTickCount)\s*\(", loop_text):
                      return True
                  pos = close_brace + 1

          if has_timing_while(fw_source):
              fail("timing while() loop found in firmware source")
          if not re.search(r'BOOT_AP_HARD_LIMIT_MS\s*=\s*60000\b', fw_source):
              fail("BOOT_AP_HARD_LIMIT_MS is no longer 60000 ms")
          if not re.search(r'ONLINE_OTA_HTTP_TIMEOUT_MS\s*=\s*60000\b', fw_source):
              fail("ONLINE_OTA_HTTP_TIMEOUT_MS is no longer 60000 ms")
          if not re.search(r'WIFI_CONNECT_MAX_ATTEMPTS\s*=\s*3\b', fw_source):
              fail("WIFI_CONNECT_MAX_ATTEMPTS is no longer 3")

          app_source = Path("lib/main.dart").read_text(encoding="utf-8")
          for anchor in manifest["required_anchors"]["app"]:
              if anchor not in app_source:
                  fail("App OTA anchor missing: " + anchor)
          if "updateAvailable = isDifferentFirmwareVersion(" not in app_source:
              fail("App update-availability path no longer uses any-different-version policy")

          for region in manifest["protected_regions"]:
              if region["file_glob"] == "firmware/JEXFYZ-V*.ino":
                  path = fw_path
                  source = fw_source
              else:
                  path = Path(region["file"])
                  source = path.read_text(encoding="utf-8")

              if region["type"] == "function":
                  _, _, fragment = find_definition(source, region["symbol"])
              elif region["type"] == "function_range":
                  s_start, _, _ = find_definition(source, region["start_symbol"])
                  _, e_end, _ = find_definition(source, region["end_symbol"])
                  fragment = source[s_start:e_end]
              else:
                  fail("unknown protected region type: " + region["type"])

              actual = git_blob_sha1(fragment.encode("utf-8"))
              expected = region["sha1_git_blob"]
              if actual != expected:
                  fail(
                      f"protected region fingerprint mismatch: {region['id']} "
                      f"(expected {expected}, got {actual})"
                  )

          if manifest.get("anti_downgrade") is not False:
              fail("anti-downgrade policy is enabled; project contract requires version-difference only")

          print("JE X FYZ OTA SECURITY SEAL: PASS")
          print(f"Active firmware: {fw_path.as_posix()} / {source_version}")
          print("OTA contract, radio handoff, App metadata validation, and version policy are sealed.")
          PY

      - name: Seal summary
        shell: bash
        run: |
          set -euo pipefail
          echo "OTA Security Seal PASS — no App APK build or release was triggered."
