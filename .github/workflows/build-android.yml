name: JE Cooler Android CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
          cache-key: flutter-3.47.4

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Configure Flutter Android SDK path
        working-directory: android
        run: printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build signed obfuscated release APK
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK_APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$SDK_APKSIGNER"
          "$SDK_APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: je-cooler-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
