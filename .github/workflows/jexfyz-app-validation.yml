# Non-publishing Flutter/Dart validation only. This workflow never builds or releases the App.
name: JE X FYZ — Validation Only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jexfyz-app-validation.yml"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "test/**"
      - "assets/**"

# The validation job needs repository read access only.
permissions:
  contents: read

jobs:
  validate:
    name: Flutter quality checks (non-publishing)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Verify Flutter and Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Resolve locked dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile

      # Keep each quality gate observable and allow the remaining checks to run
      # even when one gate fails. The final summary step restores a failing job.
      - name: Check Dart formatting (read-only)
        id: formatter
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter and Dart source
        id: analyzer
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos

      - name: Run all Flutter tests
        id: flutter_tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      # Produce a formatting-only patch after checks have run. This changes only
      # the ephemeral runner workspace; the artifact is reviewed before any source commit.
      - name: Prepare formatter patch for review
        id: formatter_preview
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.formatter.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jexfyz-format-preview"
          dart format lib test
          git diff --check
          git diff --binary > "$RUNNER_TEMP/jexfyz-format-preview/jexfyz-dart-format.patch"
          git diff --stat > "$RUNNER_TEMP/jexfyz-format-preview/format-stat.txt"
          test -s "$RUNNER_TEMP/jexfyz-format-preview/jexfyz-dart-format.patch"
          echo "Prepared a formatting-only patch for review; repository source has not been committed or published."

      - name: Upload formatter patch preview (non-publishing)
        id: formatter_preview_upload
        if: ${{ !cancelled() && steps.formatter_preview.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jexfyz-dart-format-preview
          path: ${{ runner.temp }}/jexfyz-format-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize validation results
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          FORMATTER_OUTCOME: ${{ steps.formatter.outcome }}
          FORMATTER_PREVIEW_OUTCOME: ${{ steps.formatter_preview.outcome }}
          ANALYZER_OUTCOME: ${{ steps.analyzer.outcome }}
          FLUTTER_TESTS_OUTCOME: ${{ steps.flutter_tests.outcome }}
        run: |
          set -euo pipefail

          {
            echo "## JE X FYZ — Validation Only"
            echo
            echo "Source SHA: $SOURCE_SHA"
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Locked dependency resolution | $DEPENDENCIES_OUTCOME |"
            echo "| Dart formatter | $FORMATTER_OUTCOME |"
            echo "| Formatter patch preview | $FORMATTER_PREVIEW_OUTCOME |"
            echo "| Flutter analyzer | $ANALYZER_OUTCOME |"
            echo "| Flutter tests | $FLUTTER_TESTS_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for outcome in "$DEPENDENCIES_OUTCOME" "$FORMATTER_OUTCOME" "$ANALYZER_OUTCOME" "$FLUTTER_TESTS_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done

          exit "$failed"
