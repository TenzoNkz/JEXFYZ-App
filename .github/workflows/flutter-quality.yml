name: Flutter Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "firmware/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-quality.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "firmware/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Dependency resolution, regression tests, and analysis (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies and generate lockfile
        run: flutter pub get

      # Temporary handoff for one manually reviewed lockfile commit. This step is
      # removed immediately after pubspec.lock is captured; it does not write to Git.
      - name: One-time lockfile content handoff
        if: always() && hashFiles('pubspec.lock') != ''
        run: |
          python3 - <<'PY'
          import base64
          with open("pubspec.lock", "rb") as lock_file:
              encoded = base64.b64encode(lock_file.read()).decode("ascii")
          print("LOCKFILE_EXPORT_BEGIN")
          for offset in range(0, len(encoded), 3000):
              print("LOCKFILE_B64_CHUNK:" + encoded[offset:offset + 3000])
          print("LOCKFILE_EXPORT_END")
          PY

      - name: Run regression tests
        run: flutter test

      - name: Analyze Dart and Flutter sources
        if: always()
        run: flutter analyze
