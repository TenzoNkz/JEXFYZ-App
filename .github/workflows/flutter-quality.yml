name: Flutter Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "firmware/**"
      - "pubspec.yaml"
      - ".gitignore"
      - ".github/workflows/flutter-quality.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "firmware/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: write

jobs:
  quality:
    name: Dependency lock, regression tests, and analysis (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit resolved pubspec.lock on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock is already current"
          else
            git commit -m "Lock Flutter dependency resolution"
            git push
          fi

      - name: Run regression tests
        run: flutter test

      - name: Analyze Dart and Flutter sources
        run: flutter analyze
