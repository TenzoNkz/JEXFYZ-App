# JE X FYZ App — single explicit build trigger, restored under a new filename.
# Normal pushes/PRs never start this workflow.
# The assistant creates/reopens the dedicated trigger issue only after an explicit
# "@Thinking Build App!" request.
name: JE X FYZ Build App

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.issue.title == 'JE X FYZ — BUILD APP TRIGGER'
      && contains(github.event.issue.body, 'JEXFYZ_BUILD_TRIGGER_V1')
    uses: ./.github/workflows/jexfyz-app-build-engine.yml
    secrets: inherit
