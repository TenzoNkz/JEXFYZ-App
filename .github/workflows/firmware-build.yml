name: JE X FYZ Firmware Compile

on:
  push:
    branches:
      - main
    paths:
      - "firmware/JEXFYZ-V6.0.ino"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  # Publish QC builds as a prerelease asset; Actions artifact storage is quota-limited.
  contents: write

concurrency:
  group: jexfyz-firmware-compile
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ESP32-C3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install official ESP32 Core 3.3.7
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.7

      - name: Install pinned firmware library
        run: arduino-cli lib install "Adafruit NeoPixel@1.12.3"

      - name: Compile ESP32-C3 Dev Module
        shell: bash
        run: |
          set -euo pipefail
          SKETCH_DIR="$RUNNER_TEMP/JEXFYZ_V6_0"
          mkdir -p "$SKETCH_DIR" build/firmware
          cp firmware/JEXFYZ-V6.0.ino "$SKETCH_DIR/JEXFYZ_V6_0.ino"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
            --warnings all \
            --output-dir build/firmware \
            "$SKETCH_DIR"

          BUILT_BIN="build/firmware/JEXFYZ_V6_0.ino.bin"
          test -s "$BUILT_BIN"

          MAGIC="$(od -An -tx1 -N1 "$BUILT_BIN" | tr -d ' \n')"
          if [ "$MAGIC" != "e9" ]; then
            echo "Firmware image validation failed: expected ESP image magic E9, got $MAGIC"
            exit 1
          fi

          SIZE="$(stat -c%s "$BUILT_BIN")"
          MAX_SIZE=$((1792 * 1024))
          if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Firmware image size outside OTA limit: $SIZE bytes (max $MAX_SIZE)"
            exit 1
          fi

          cp "$BUILT_BIN" build/firmware/JEXFYZ.cpp.bin
          sha256sum build/firmware/JEXFYZ.cpp.bin
          ls -lh build/firmware/JEXFYZ.cpp.bin
          echo "Firmware source compiled successfully; image magic and OTA size limit passed."

      # Use a prerelease asset instead of Actions artifacts because this repository's
      # Actions artifact storage quota is already exhausted. This is QC only:
      # it does not change the separate OTA firmware repository or Firebase metadata.
      - name: Publish QC build to a GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="firmware-qc-latest"
          TITLE="JE X FYZ Firmware — QC Build (not OTA)"
          BIN="build/firmware/JEXFYZ.cpp.bin"
          NOTES="QC-only firmware build from source commit $GITHUB_SHA.
          Firmware FW_VERSION remains V6.0.
          This prerelease is for manual/local OTA testing only; the production OTA BIN and Firebase metadata are unchanged."

          test -s "$BIN"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$BIN" --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$TAG" "$BIN" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          fi

          gh release view "$TAG" \
            --json assets,isPrerelease \
            --jq '.assets[] | select(.name == "JEXFYZ.cpp.bin") | .name' \
            | grep -Fx "JEXFYZ.cpp.bin"

          VERIFY_DIR="$RUNNER_TEMP/firmware-qc-verify"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" \
            --pattern "JEXFYZ.cpp.bin" \
            --dir "$VERIFY_DIR" \
            --clobber

          LOCAL_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          RELEASE_SHA="$(sha256sum "$VERIFY_DIR/JEXFYZ.cpp.bin" | awk '{print $1}')"
          test "$LOCAL_SHA" = "$RELEASE_SHA"
          echo "QC prerelease asset verified. SHA-256: $RELEASE_SHA"
