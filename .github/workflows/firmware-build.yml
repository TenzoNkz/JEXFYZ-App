name: Firmware Build

on:
  push:
    paths:
      - ".github/FIRMWARE_BUILD_TRIGGER"

permissions:
  contents: read

concurrency:
  group: jexfyz-firmware-build
  cancel-in-progress: false

env:
  ESP32_CORE_VERSION: "3.3.12"
  ONEBUTTON_VERSION: "2.6.1"
  ADAFRUIT_NEOPIXEL_VERSION: "1.12.5"
  PUBLIC_FIRMWARE_REPO: "TenzoNkz/JEXFYZ-Firmware"

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v6

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Prepare Arduino package index
        run: |
          set -euo pipefail
          arduino-cli version
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32-C3 core
        run: |
          set -euo pipefail
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli core list

      - name: Install firmware libraries
        run: |
          set -euo pipefail
          arduino-cli lib install "OneButton@${ONEBUTTON_VERSION}"
          arduino-cli lib install "Adafruit NeoPixel@${ADAFRUIT_NEOPIXEL_VERSION}"
          arduino-cli lib list

      - name: Audit firmware source identity
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware/JEXFYZ.ino
          grep -Fq 'BLE_NAME[] = "JE X FYZ"' firmware/JEXFYZ.ino
          grep -Fq 'SERVICE_UUID[] = "6f1c0001-7f35-4d0f-9b9a-7e9b2f5c1001"' firmware/JEXFYZ.ino
          grep -Fq 'RX_UUID[]      = "6f1c0002-7f35-4d0f-9b9a-7e9b2f5c1001"' firmware/JEXFYZ.ino
          grep -Fq 'TX_UUID[]      = "6f1c0003-7f35-4d0f-9b9a-7e9b2f5c1001"' firmware/JEXFYZ.ino
          grep -Fq 'FW_VERSION[]' firmware/JEXFYZ.ino
          echo "Firmware source audit passed."

      - name: Extract firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("firmware/JEXFYZ.ino").read_text(encoding="utf-8")
          match = re.search(r'FW_VERSION\[\]\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("FW_VERSION not found")
          version = match.group(1).strip().upper()
          if not re.fullmatch(r"V\d+(?:\.\d+)?", version):
              raise SystemExit(f"Unsupported firmware version: {version}")
          print(version)
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: OTA protected-source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("firmware/JEXFYZ.ino").read_text(encoding="utf-8")
          required = [
              "OTA SAFETY LOCK",
              "OTA STATE / PRIORITY LOCK",
              "OTA PRIORITY SUPERVISOR — LOCKED",
              "OTA ENGINE — LOCKED",
              "OTA DIAGNOSTIC CORE — LOCKED",
              "serviceOtaPriority()",
              "startLocalOtaAp();",
              "processOnlineOta();",
              "localOtaUploadHandler",
              "esp_ota_begin",
              "esp_ota_write",
              "esp_ota_end",
              "esp_ota_set_boot_partition",
              "ONLINE_RANGE_PROBE",
              "ONLINE_RANGE_REQUEST",
              "ONLINE_RANGE_RESUME",
              "OTA_STAGE",
              "OTA_PROGRESS",
              "OTA_ERROR_CODE",
              "OTA_ERROR",
              "LAST_OTA_RESULT",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("OTA SAFETY AUDIT FAILED: " + ", ".join(missing))
          if 'static constexpr char FW_VERSION[] = "V4.6";' not in s:
              raise SystemExit("OTA SAFETY AUDIT FAILED: version is not V4.6")
          if "setInsecure()" in s:
              raise SystemExit("OTA SAFETY AUDIT FAILED: insecure TLS leaked into release source")
          loop_start = s.index("void loop()")
          loop = s[loop_start:]
          ota_pos = loop.index("serviceOtaPriority()")
          feature_pos = loop.find("touchButton.tick()")
          if feature_pos != -1 and ota_pos > feature_pos:
              raise SystemExit("OTA SAFETY AUDIT FAILED: feature processing precedes OTA supervisor")
          ota_start = s.index("OTA ENGINE — LOCKED")
          ota_end = s.index("END OTA ENGINE — LOCKED")
          if s.count("OTA SAFETY LOCK") != 1:
              raise SystemExit("OTA SAFETY AUDIT FAILED: duplicate/missing top safety lock")
          if s.count("OTA ENGINE — LOCKED") != 1:
              raise SystemExit("OTA SAFETY AUDIT FAILED: OTA engine lock marker invalid")
          if s.count("OTA PRIORITY SUPERVISOR — LOCKED") != 1:
              raise SystemExit("OTA SAFETY AUDIT FAILED: OTA supervisor lock marker invalid")
          if "delay(" in s[ota_start:ota_end]:
              raise SystemExit("OTA SAFETY AUDIT FAILED: delay() inside OTA engine")
          print("OTA SAFETY AUDIT: PASS")
          PY
      - name: Compile ESP32-C3 firmware
        run: |
          set -euo pipefail
          rm -rf build/firmware build/JEXFYZ
          mkdir -p build/firmware build/JEXFYZ
          cp firmware/JEXFYZ.ino build/JEXFYZ/JEXFYZ.ino
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=no_fs \
            --output-dir build/firmware \
            build/JEXFYZ
          BIN="build/firmware/JEXFYZ.ino.bin"
          test -s "$BIN"
          MAX_FIRMWARE_BYTES=$((2 * 1024 * 1024))
          FIRMWARE_BYTES=$(stat -c%s "$BIN")
          echo "Firmware binary size: $FIRMWARE_BYTES bytes"
          if [ "$FIRMWARE_BYTES" -gt "$MAX_FIRMWARE_BYTES" ]; then
            echo "Firmware exceeds 2 MiB OTA release limit: $FIRMWARE_BYTES > $MAX_FIRMWARE_BYTES"
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BIN="JEXFYZ-${VERSION}.bin"
          cp "$BIN" "build/firmware/$RELEASE_BIN"
          ls -lh "build/firmware/$RELEASE_BIN"

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@v7
        with:
          name: JEXFYZ-${{ steps.version.outputs.version }}
          path: build/firmware/JEXFYZ-${{ steps.version.outputs.version }}.bin
          if-no-files-found: error
          compression-level: 0

      - name: Prepare ArduinoDroid temporary source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp firmware/JEXFYZ.ino "build/firmware/JEXFYZ-${VERSION}-ArduinoDroid-Temporary.ino"
          sed -i '1i #define JEXFYZ_LEGACY_OTA 1' "build/firmware/JEXFYZ-${VERSION}-ArduinoDroid-Temporary.ino"
          sed -i \
            -e 's/#include <NetworkClientSecure.h>/#include <WiFiClientSecure.h>/' \
            -e 's/NetworkClientSecure cloudClient;/WiFiClientSecure cloudClient;/' \
            -e 's/cloudClient.useBuiltinCACertBundle();/cloudClient.setInsecure();/' \
            -e '/case UPDATE_ERROR_SHA256:/d' \
            -e '/case UPDATE_ERROR_SHA512:/d' \
            "build/firmware/JEXFYZ-${VERSION}-ArduinoDroid-Temporary.ino"
          grep -Fq '#include <WiFiClientSecure.h>' "build/firmware/JEXFYZ-${VERSION}-ArduinoDroid-Temporary.ino"
          grep -Fq 'WiFiClientSecure cloudClient;' "build/firmware/JEXFYZ-${VERSION}-ArduinoDroid-Temporary.ino"
          grep -Fq 'cloudClient.setInsecure();' "build/firmware/JEXFYZ-${VERSION}-ArduinoDroid-Temporary.ino"

      - name: Upload ArduinoDroid temporary source artifact
        uses: actions/upload-artifact@v7
        with:
          name: JEXFYZ-${{ steps.version.outputs.version }}-ArduinoDroid-Source
          path: build/firmware/JEXFYZ-${{ steps.version.outputs.version }}-ArduinoDroid-Temporary.ino
          if-no-files-found: error
          compression-level: 0


      - name: Publish firmware release to public repository
        shell: bash
        env:
          TENZO_FULL_ACCESS: ${{ secrets.TENZO_FULL_ACCESS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TENZO_FULL_ACCESS:-}" ]; then
            echo "Missing required GitHub secret: TENZO_FULL_ACCESS"
            echo "Create a fine-grained token with Contents: Read and write on ${PUBLIC_FIRMWARE_REPO}, then save it as this repository secret `TENZO_FULL_ACCESS`."
            exit 1
          fi

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          git clone --depth 1 \
            "https://x-access-token:${TENZO_FULL_ACCESS}@github.com/${PUBLIC_FIRMWARE_REPO}.git" \
            "$WORK/repo"

          cd "$WORK/repo"

          RELEASE_BIN="JEXFYZ-${VERSION}.bin"
          rm -f JEXFYZ.cpp.bin
          find . -maxdepth 1 -type f -name 'JEXFYZ-V*.bin' ! -name "$RELEASE_BIN" -delete
          cp "$GITHUB_WORKSPACE/build/firmware/$RELEASE_BIN" "$RELEASE_BIN"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          filename = f"JEXFYZ-{version}.bin"
          manifest = {
              "version": version,
              "url": f"https://raw.githubusercontent.com/TenzoNkz/JEXFYZ-Firmware/main/{filename}",
          }
          Path("manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No firmware distribution changes to commit."
            exit 0
          fi

          git commit -m "release firmware $VERSION"
          git push origin main
