name: JE X FYZ Hosted Runner Diagnostic

# Manual diagnostic only. This workflow never checks out source, builds APKs,
# reads secrets, or publishes release assets. Use it to isolate runner allocation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-runner-smoke:
    name: Verify hosted runner allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Emit non-sensitive runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          printf 'GITHUB_RUN_ID=%s\n' "$GITHUB_RUN_ID"
          printf 'GITHUB_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
          printf 'RUNNER_NAME=%s\n' "${RUNNER_NAME:-missing}"
          printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-missing}"
          printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-missing}"
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          test -n "${RUNNER_NAME:-}"
          test "${RUNNER_OS:-}" = "Linux"
          echo "HOSTED_RUNNER_DISPATCH=SUCCESS"
