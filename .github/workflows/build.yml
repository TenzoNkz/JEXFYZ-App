name: JE X FYZ Cooler Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jexfyz-cooler-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version
          java -version
          gradle --version

      - name: Prepare Flutter local.properties
        shell: bash
        run: |
          set -euo pipefail
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          test -s android/local.properties
          echo "local.properties:"
          cat android/local.properties

      - name: Restore Gradle wrapper if missing
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

      - name: JE X FYZ architecture and asset audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("lib/main.dart").read_text(encoding="utf-8")
          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")

          required = [
              "6f1c0001-7f35-4d0f-9b9a-7e9b2f5c1001",
              "6f1c0002-7f35-4d0f-9b9a-7e9b2f5c1001",
              "6f1c0003-7f35-4d0f-9b9a-7e9b2f5c1001",
              "PHONE:BT=",
              "CLOUDOTA",
              "FirebaseDatabase.instanceFor",
              "firmware_update",
              "flutter_secure_storage",
              "onChangeEnd",
              "assets/jexfyzcooler.png",
              "assets/jexfyzicon.png",
          ]

          missing = [token for token in required if token not in source and token not in pubspec]
          if missing:
              raise SystemExit("JE X FYZ audit failed; missing: " + ", ".join(missing))

          for legacy in ["assets/hzcooler.png", "assets/hzicon.png"]:
              if legacy in source or legacy in pubspec:
                  raise SystemExit("JE X FYZ audit failed; legacy asset reference: " + legacy)

          if "@drawable/hzicon" in manifest:
              raise SystemExit("JE X FYZ audit failed; legacy Android icon reference found")

          if "@drawable/jexfyzicon" not in manifest:
              raise SystemExit("JE X FYZ audit failed; Android icon is not jexfyzicon")

          for pattern in [
              r"\bCFG:",
              r"\bADAPT:",
              r"RGBTOGGLE",
              r"RGBPREV",
              r"RGBNEXT",
              r"\bBR:",
              r"AIM:",
          ]:
              if re.search(pattern, source):
                  raise SystemExit("JE X FYZ audit failed; legacy command found: " + pattern)

          if re.search(r"firmwareDb[\s\S]*\.(set|update|push|removeValue)\s*\(", source):
              raise SystemExit("JE X FYZ audit failed; Firebase runtime write path detected")

          if "setString('saved_pass'" in source or 'setString("saved_pass"' in source:
              raise SystemExit("JE X FYZ audit failed; Wi-Fi password stored outside secure storage")

          for asset in [
              Path("assets/jexfyzcooler.png"),
              Path("assets/jexfyzicon.png"),
              Path("android/app/src/main/res/drawable-nodpi/jexfyzicon.png"),
          ]:
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit("JE X FYZ audit failed; missing/empty asset: " + str(asset))

          print("JE X FYZ architecture and asset audit passed.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build latest release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          APK_SIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APK_SIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Prepare clean APK filename
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/JE-X-FYZ-Latest.apk
          test -s build/app/outputs/flutter-apk/JE-X-FYZ-Latest.apk

      - name: Upload APK only
        uses: actions/upload-artifact@v7
        with:
          name: JE-X-FYZ-Latest-App
          path: build/app/outputs/flutter-apk/JE-X-FYZ-Latest.apk
          archive: false
          if-no-files-found: error

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v7
        with:
          name: JE-X-FYZ-Dart-Symbols
          path: build/symbols
          if-no-files-found: error
          compression-level: 0
